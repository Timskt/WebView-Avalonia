name: Build codec-enabled CEF 106 and 134

on:
  # Bootstrap this new workflow before it reaches the default branch. Limiting
  # the push trigger to this workflow file prevents normal branch updates from
  # repeatedly starting the very expensive Chromium build.
  push:
    branches:
      - feature/h264-h265-codecs
    paths:
      - .github/workflows/build-cef-codecs.yml
      - config/cef-lines.json
      - scripts/build-cef-codecs.sh
      - scripts/package-cef-runtime.py
      - scripts/package-managed-codecs.sh
      - scripts/verify-nuget-consumer.sh
      - scripts/verify-package-layout.py
      - scripts/cef_line_config.py
      - vendor/CefGlue/CefGlue.Common/CefGlue.Common.csproj
      - vendor/CefGlue-134/CefGlue.Packages.props
      - WebView/WebViewControl.Avalonia/WebViewControl.Avalonia.csproj
      - WebView/SampleWebView.Avalonia/MainWindow.xaml
      - WebView/SampleWebView.Avalonia/MainWindowViewModel.cs
  workflow_dispatch:
    inputs:
      cef_line:
        description: CEF product line to build
        required: true
        default: both
        type: choice
        options:
          - both
          - '134'
          - '106'
      build_cef:
        description: Build pinned CEF/Chromium sources (very large and slow)
        required: true
        default: true
        type: boolean
      publish_release:
        description: Create a GitHub prerelease after all selected lines pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cef-codecs-${{ github.ref }}-${{ inputs.cef_line || 'both' }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  prepare:
    name: Prepare selected build matrices
    runs-on: ubuntu-24.04
    outputs:
      native_matrix: ${{ steps.matrix.outputs.native_matrix }}
      managed_matrix: ${{ steps.matrix.outputs.managed_matrix }}
    steps:
      - id: matrix
        name: Generate selected line/RID matrices
        shell: bash
        env:
          SELECTED_LINE: ${{ inputs.cef_line || 'both' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          selection = os.environ["SELECTED_LINE"]
          lines = ["106", "134"] if selection == "both" else [selection]
          # Native CEF builds are intentionally limited for this delivery:
          # CEF 106/win-x64 is the Windows 7 compatibility line and
          # CEF 134/win-x64 is the Windows 10/modern Windows line. The
          # cross-platform packaging/code paths remain in the repository and
          # can be re-enabled by expanding this list in a future build.
          native_targets = [
              {"rid": "win-x64", "os": "windows-2022", "arch": "x64"},
          ]
          native = {"include": [{"line": line, **target} for line in lines for target in native_targets]}
          managed = {"include": [{"line": line} for line in lines]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"native_matrix={json.dumps(native, separators=(',', ':'))}\n")
              output.write(f"managed_matrix={json.dumps(managed, separators=(',', ':'))}\n")
          PY

  validate:
    name: Validate workflow inputs and repository tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate input invariants
        shell: bash
        run: |
          set -euxo pipefail
          if [[ '${{ inputs.publish_release }}' == 'true' && '${{ inputs.build_cef }}' != 'true' ]]; then
            echo 'publish_release=true requires build_cef=true. Synthetic or stock runtimes must never be released.' >&2
            exit 1
          fi

      - name: Validate scripts and exact line configuration
        shell: bash
        run: |
          set -euxo pipefail
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py
          python3 scripts/cef_line_config.py 106 --format json
          python3 scripts/cef_line_config.py 134 --format json
          git diff --check

  build-cef:
    if: github.event_name == 'push' || inputs.build_cef
    needs: [prepare, validate]
    name: CEF ${{ matrix.line }} / ${{ matrix.rid }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load exact CEF line configuration
        shell: bash
        run: python3 scripts/cef_line_config.py '${{ matrix.line }}' --format github-env >> "$GITHUB_ENV"

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo systemctl stop docker.service containerd.service 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libcups2-dev

      - name: Free macOS runner disk space
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          # Chromium/CEF 106/134 checkouts can exceed 40 GiB before the
          # build starts. Keep the selected Xcode toolchain, but remove
          # unused Xcode bundles, simulator runtimes, and SDK caches.
          selected_developer_dir="$(xcode-select -p)"
          selected_xcode_app="${selected_developer_dir%/Contents/Developer}"
          for xcode_app in /Applications/Xcode*.app; do
            if [[ -d "$xcode_app" && "$xcode_app" != "$selected_xcode_app" ]]; then
              sudo rm -rf "$xcode_app"
            fi
          done
          sudo rm -rf \
            /Library/Developer/CoreSimulator \
            "$HOME/Library/Developer/CoreSimulator" \
            "$HOME/Library/Android" \
            "$HOME/Library/Caches" \
            "$HOME/.cache"
          df -h

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cef-$CEF_LINE-${{ matrix.rid }}"
          mkdir -p "$root"
          git clone --filter=blob:none https://chromium.googlesource.com/chromium/tools/depot_tools.git "$root/depot_tools"

      - name: Build exact pinned CEF with codec paths
        shell: bash
        env:
          DEPOT_TOOLS_DIR: ${{ runner.temp }}/cef-${{ matrix.line }}-${{ matrix.rid }}/depot_tools
          CEF_SOURCE_DIR: ${{ runner.temp }}/cef-${{ matrix.line }}-${{ matrix.rid }}/source
          CEF_ARCH: ${{ matrix.arch }}
          CEF_PLATFORM: ${{ runner.os }}
        run: ./scripts/build-cef-codecs.sh

      - name: Package and verify codec runtime NuGet
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cef-$CEF_LINE-${{ matrix.rid }}"
          python3 scripts/package-cef-runtime.py \
            --line "$CEF_LINE" \
            --rid '${{ matrix.rid }}' \
            --source "$root/source/chromium/src/cef/binary_distrib" \
            --version "$CEF_RUNTIME_VERSION" \
            --output "$root/runtime-packages" \
            --codec-enabled
          package="$(find "$root/runtime-packages" -maxdepth 1 -name '*.nupkg' -print -quit)"
          test -n "$package"
          python3 scripts/verify-package-layout.py "$package" \
            --kind runtime --line "$CEF_LINE" --rid '${{ matrix.rid }}'

      - name: Upload verified runtime NuGet
        uses: actions/upload-artifact@v4
        with:
          name: cef-${{ matrix.line }}-runtime-${{ matrix.rid }}
          path: ${{ runner.temp }}/cef-${{ matrix.line }}-${{ matrix.rid }}/runtime-packages/*.nupkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-managed:
    if: (github.event_name == 'push' || inputs.build_cef) && needs['build-cef'].result == 'success'
    needs: [prepare, build-cef]
    name: Managed Windows x64 packages / CEF ${{ matrix.line }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.managed_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load exact CEF line configuration
        shell: bash
        run: python3 scripts/cef_line_config.py '${{ matrix.line }}' --format github-env >> "$GITHUB_ENV"

      - name: Download verified Windows x64 runtime package
        uses: actions/download-artifact@v4
        with:
          pattern: cef-${{ matrix.line }}-runtime-win-x64
          merge-multiple: true
          path: artifacts/feed

      - name: Write isolated NuGet configuration
        shell: bash
        run: |
          set -euxo pipefail
          feed="$(pwd)/artifacts/feed"
          cat > artifacts/NuGet.Codecs.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <config>
              <add key="globalPackagesFolder" value="$(pwd)/artifacts/nuget-cache" />
            </config>
            <packageSources>
              <clear />
              <add key="codec-feed" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Verify downloaded runtime packages
        shell: bash
        run: |
          set -euxo pipefail
          package="artifacts/feed/chromiumembeddedframework.runtime.win-x64.$CEF_RUNTIME_VERSION.nupkg"
          python3 scripts/verify-package-layout.py "$package" \
            --kind runtime --line "$CEF_LINE" --rid win-x64

      - name: Build, pack, and verify CefGlue and WebView
        shell: bash
        run: ./scripts/package-managed-codecs.sh --line "$CEF_LINE" --feed artifacts/feed --config artifacts/NuGet.Codecs.Config --rids win-x64

      - name: Verify NuGet consumer output for Windows x64
        shell: bash
        run: ./scripts/verify-nuget-consumer.sh --line "$CEF_LINE" --config artifacts/NuGet.Codecs.Config --work artifacts/consumer --rids win-x64

      - name: Build html5test demo Windows x64 smoke target
        shell: bash
        run: |
          set -euxo pipefail
          dotnet restore WebView/SampleWebView.Avalonia/SampleWebView.Avalonia.csproj \
            --force --configfile artifacts/NuGet.Codecs.Config \
            -p:CefLine="$CEF_LINE" -p:Platform=x64 -p:PlatformTarget=x64 -r win-x64
          dotnet build WebView/SampleWebView.Avalonia/SampleWebView.Avalonia.csproj \
            -c ReleaseAvalonia --no-restore \
            -p:CefLine="$CEF_LINE" -p:Platform=x64 -p:PlatformTarget=x64 -r win-x64
          python3 scripts/verify-package-layout.py \
            WebView/SampleWebView.Avalonia/bin/x64/ReleaseAvalonia/$TARGET_FRAMEWORK/win-x64 \
            --kind consumer --line "$CEF_LINE" --rid win-x64

      - name: Upload all verified NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: cef-${{ matrix.line }}-codecs-nuget-packages
          path: artifacts/feed/*.nupkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_cef && inputs.publish_release
    needs: package-managed
    name: Create verified codec prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download selected verified package sets
        uses: actions/download-artifact@v4
        with:
          pattern: cef-*-codecs-nuget-packages
          merge-multiple: true
          path: artifacts/release

      - name: Reject synthetic artifacts and incomplete selections
        shell: bash
        run: |
          set -euxo pipefail
          selection='${{ inputs.cef_line }}'
          if [[ "$selection" == 'both' ]]; then lines=(106 134); else lines=("$selection"); fi
          for line in "${lines[@]}"; do
            eval "$(python3 scripts/cef_line_config.py "$line" --format shell)"
            python3 scripts/verify-package-layout.py \
              "artifacts/release/chromiumembeddedframework.runtime.win-x64.$CEF_RUNTIME_VERSION.nupkg" \
              --kind runtime --line "$line" --rid win-x64
            test -f "artifacts/release/WebViewControl-Avalonia.$WEBVIEW_VERSION.nupkg"
            ! test -f "artifacts/release/WebViewControl-Avalonia-ARM64.$WEBVIEW_VERSION.nupkg"
          done
          if [[ "$selection" == '106' ]]; then
            ! test -f artifacts/release/WebViewControl-Avalonia.3.134.178-codecs.1.nupkg
          elif [[ "$selection" == '134' ]]; then
            ! test -f artifacts/release/WebViewControl-Avalonia.3.120.11-cef106-codecs.1.nupkg
          fi

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="cef-codecs-${{ inputs.cef_line }}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" artifacts/release/*.nupkg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CEF ${{ inputs.cef_line }} codec packages build $GITHUB_RUN_NUMBER" \
            --notes-file docs/RELEASE-NOTES-CODECS-AND-SUBPROCESS.md
